<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Insights + Marketing Tool | Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f8;
            color: #1e293b;
            padding: 28px;
        }
        
        .container { max-width: 1600px; margin: 0 auto; }
        
        .header {
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #1e293b, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .product-tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        
        .product-tile {
            background: white;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .product-tile:hover {
            border-color: #2563eb;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }
        
        .product-tile.active {
            border-color: #2563eb;
            background: linear-gradient(135deg, #f0f9ff, #ffffff);
        }
        
        .tile-icon { font-size: 48px; }
        .tile-info h3 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .tile-info p { font-size: 13px; color: #64748b; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 18px 20px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        
        .stat-number { font-size: 32px; font-weight: 800; color: #1e293b; }
        .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .search-box {
            padding: 10px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 40px;
            width: 260px;
            font-size: 13px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        
        .btn-primary { background: #1e293b; color: white; }
        .btn-primary:hover { background: #0f172a; transform: translateY(-1px); }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-outline { background: white; border: 1.5px solid #e2e8f0; color: #1e293b; }
        .btn-outline:hover { border-color: #2563eb; background: #f8fafc; }
        .btn-sm { padding: 6px 12px; font-size: 11px; }
        
        .table-container {
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            overflow-x: auto;
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            background: #f8fafc;
            padding: 14px 12px;
            text-align: left;
            font-weight: 700;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tr:hover td { background: #fafcff; }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-active { background: #dcfce7; color: #15803d; }
        .badge-inactive { background: #fee2e2; color: #b91c1c; }
        .badge-trial { background: #fef3c7; color: #92400e; }
        .badge-paid { background: #dbeafe; color: #1e40af; }
        
        .token-cell {
            font-family: monospace;
            font-size: 10px;
            max-width: 180px;
            word-break: break-all;
        }
        
        .copy-btn {
            background: #e2e8f0;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 9px;
            margin-left: 6px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 28px;
            border-radius: 20px;
            width: 520px;
            max-width: 90%;
        }
        
        .modal-content h3 { font-size: 22px; margin-bottom: 20px; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px 14px;
            margin: 8px 0 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px;
        }
        .modal-content label { font-size: 12px; font-weight: 600; color: #475569; }
        
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        
        .loading { text-align: center; padding: 60px; color: #64748b; }
        
        @media (max-width: 900px) {
            .product-tiles { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            body { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    
    <div class="header">
        <h1>⚡ Revenue Insights + Marketing Tool</h1>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="fetchAllData()">🔄 Refresh</button>
        </div>
    </div>
    
    <!-- Product Tiles -->
    <div class="product-tiles">
        <div class="product-tile" id="tileRevenue" onclick="selectProduct('revenue')">
            <div class="tile-icon">📊</div>
            <div class="tile-info">
                <h3>Revenue Insights</h3>
                <p>Hotel rate intelligence · Daily rate tracking · Competitor analysis</p>
            </div>
        </div>
        <div class="product-tile" id="tileMarketing" onclick="selectProduct('marketing')">
            <div class="tile-icon">✉️</div>
            <div class="tile-info">
                <h3>Marketing Tool</h3>
                <p>Cold email outreach · PDF-powered templates · Campaign tracking</p>
            </div>
        </div>
    </div>
    
    <!-- Stats Section -->
    <div id="statsGrid" class="stats-grid"></div>
    
    <!-- Action Bar -->
    <div class="action-bar">
        <input type="text" id="searchInput" class="search-box" placeholder="Search by name, email..." onkeyup="filterTable()">
        <div>
            <button id="createBtn" class="btn btn-success" onclick="showCreateModal()">➕ Create New User</button>
            <button id="exportBtn" class="btn btn-outline" onclick="exportData()" style="display:none;">📎 Export CSV</button>
        </div>
    </div>
    
    <!-- Table Container -->
    <div id="tableContainer" class="table-container">
        <div class="loading">Loading data...</div>
    </div>
    
</div>

<!-- Create User Modal -->
<div id="createModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Create New User</h3>
        <input type="text" id="userFullName" placeholder="Full Name">
        <input type="email" id="userEmail" placeholder="Email Address">
        <input type="text" id="userCompany" placeholder="Company Name">
        <select id="userProduct">
            <option value="marketing">Marketing Tool</option>
            <option value="revenue">Revenue Insights</option>
        </select>
        <label style="margin-top:8px;">Trial Period</label>
        <select id="trialDays">
            <option value="7">7 days free trial</option>
            <option value="14">14 days free trial</option>
            <option value="30">30 days free trial</option>
            <option value="0">No trial (immediate paid)</option>
        </select>
        <label>Email Limit (trial)</label>
        <input type="number" id="emailLimit" value="20" placeholder="Email limit during trial">
        <div class="modal-buttons">
            <button class="btn btn-primary" onclick="createUser()">Create User</button>
            <button class="btn btn-outline" onclick="closeCreateModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- Edit User Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>Edit User</h3>
        <input type="text" id="editUserId" hidden>
        <label>Full Name</label>
        <input type="text" id="editFullName">
        <label>Email Limit</label>
        <input type="number" id="editEmailLimit">
        <label>Emails Used</label>
        <input type="number" id="editEmailsUsed">
        <label>Status</label>
        <select id="editStatus">
            <option value="1">Active</option>
            <option value="0">Inactive</option>
        </select>
        <label>Extend Trial (days)</label>
        <input type="number" id="editExtendTrial" placeholder="0 to not extend">
        <div class="modal-buttons">
            <button class="btn btn-primary" onclick="updateUser()">Save Changes</button>
            <button class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    const ADMIN_KEY = "your-secret-admin-key-here"; // CHANGE THIS!
    const API = "https://backend-x5sw.onrender.com";
    
    let currentProduct = 'revenue';
    let revenueData = { owners: [], hotels: [] };
    let marketingData = { users: [] };
    
    async function fetchAllData() {
        await fetchRevenueData();
        await fetchMarketingData();
        updateUI();
    }
    
    async function fetchRevenueData() {
        try {
            const res = await fetch(`${API}/admin/clients`);
            const data = await res.json();
            revenueData.owners = data.owners || [];
            revenueData.hotels = data.hotels || [];
        } catch (err) {
            console.error("Revenue data error:", err);
            revenueData.owners = [];
            revenueData.hotels = [];
        }
    }
    
    async function fetchMarketingData() {
        try {
            const res = await fetch(`${API}/marketing/users/list`, {
                headers: { "X-Admin-Key": ADMIN_KEY }
            });
            const data = await res.json();
            marketingData.users = data.users || [];
        } catch (err) {
            console.error("Marketing data error:", err);
            marketingData.users = [];
        }
    }
    
    function updateUI() {
        updateStats();
        renderTable();
        document.getElementById('exportBtn').style.display = currentProduct === 'marketing' ? 'inline-block' : 'none';
    }
    
    function updateStats() {
        const statsContainer = document.getElementById('statsGrid');
        if (currentProduct === 'revenue') {
            statsContainer.innerHTML = `
                <div class="stat-card"><div class="stat-number">${revenueData.owners.length}</div><div class="stat-label">Total Owners</div></div>
                <div class="stat-card"><div class="stat-number">${revenueData.hotels.length}</div><div class="stat-label">Total Hotels</div></div>
                <div class="stat-card"><div class="stat-number">${revenueData.owners.filter(o => o.is_active === 1).length}</div><div class="stat-label">Active Owners</div></div>
                <div class="stat-card"><div class="stat-number">-</div><div class="stat-label">Hotels per Owner</div></div>
            `;
        } else {
            const totalSent = marketingData.users.reduce((sum, u) => sum + (u.stats?.total_sent || 0), 0);
            const totalOpens = marketingData.users.reduce((sum, u) => sum + (u.stats?.opened || 0), 0);
            const openRate = totalSent > 0 ? Math.round((totalOpens / totalSent) * 100) : 0;
            statsContainer.innerHTML = `
                <div class="stat-card"><div class="stat-number">${marketingData.users.length}</div><div class="stat-label">Total Users</div></div>
                <div class="stat-card"><div class="stat-number">${totalSent}</div><div class="stat-label">Emails Sent</div></div>
                <div class="stat-card"><div class="stat-number">${totalOpens}</div><div class="stat-label">Opens</div></div>
                <div class="stat-card"><div class="stat-number">${openRate}%</div><div class="stat-label">Open Rate</div></div>
            `;
        }
    }
    
    function renderTable() {
        const container = document.getElementById('tableContainer');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        
        if (currentProduct === 'revenue') {
            renderRevenueTable(container, searchTerm);
        } else {
            renderMarketingTable(container, searchTerm);
        }
    }
    
    function renderRevenueTable(container, searchTerm) {
        const filtered = revenueData.owners.filter(o => 
            o.owner_id?.toLowerCase().includes(searchTerm) ||
            o.owner_name?.toLowerCase().includes(searchTerm) ||
            o.email?.toLowerCase().includes(searchTerm)
        );
        
        if (filtered.length === 0) {
            container.innerHTML = '<div style="padding: 60px; text-align: center; color: #64748b;">No owners found. Click "Create New User" to add one.</div>';
            return;
        }
        
        let html = `<table><thead><tr>
            <th>Owner ID</th><th>Name</th><th>Email</th><th>Token</th><th>Status</th><th>Tier</th><th>Hotels</th><th>Actions</th>
        </tr></thead><tbody>`;
        
        for (const owner of filtered) {
            const hotelsForOwner = revenueData.hotels.filter(h => h.owner_id === owner.owner_id);
            html += `<tr>
                <td><strong>${escapeHtml(owner.owner_id)}</strong></td>
                <td>${escapeHtml(owner.owner_name)}</td>
                <td>${escapeHtml(owner.email)}</td>
                <td class="token-cell">${escapeHtml(owner.access_token?.substring(0, 20))}...<button class="copy-btn" onclick="copyToClipboard('${owner.access_token}')">Copy</button></td>
                <td><span class="badge ${owner.is_active === 1 ? 'badge-active' : 'badge-inactive'}">${owner.is_active === 1 ? 'Active' : 'Inactive'}</span></td>
                <td><span class="badge">${escapeHtml(owner.service_tier)}</span></td>
                <td>${hotelsForOwner.length}</td>
                <td><button class="btn btn-sm btn-outline" onclick="alert('Revenue Insights: Manage hotels feature coming soon')">Manage</button></td>
            </tr>`;
        }
        
        html += `</tbody></table>`;
        container.innerHTML = html;
    }
    
    function renderMarketingTable(container, searchTerm) {
        const filtered = marketingData.users.filter(u => 
            u.full_name?.toLowerCase().includes(searchTerm) ||
            u.email?.toLowerCase().includes(searchTerm) ||
            u.company_name?.toLowerCase().includes(searchTerm)
        );
        
        if (filtered.length === 0) {
            container.innerHTML = '<div style="padding: 60px; text-align: center; color: #64748b;">No marketing users found. Click "Create New User" to add one.</div>';
            return;
        }
        
        let html = `<table><thead><tr>
            <th>User</th><th>Email</th><th>Company</th><th>Trial Expiry</th><th>Email Usage</th><th>Stats</th><th>Status</th><th>Actions</th>
        </tr></thead><tbody>`;
        
        for (const user of filtered) {
            const isTrialValid = user.trial_expiry && new Date(user.trial_expiry) > new Date();
            const usagePercent = (user.emails_used / user.email_limit) * 100;
            const openRate = user.stats?.total_sent > 0 ? Math.round((user.stats.opened / user.stats.total_sent) * 100) : 0;
            
            html += `<tr>
                <td><strong>${escapeHtml(user.full_name)}</strong></td>
                <td>${escapeHtml(user.email)}</td>
                <td>${escapeHtml(user.company_name || '-')}</td>
                <td>${user.trial_expiry ? formatDate(user.trial_expiry) + (isTrialValid ? ' ✅' : ' ⚠️') : 'N/A'}</td>
                <td>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <span>${user.emails_used}/${user.email_limit}</span>
                        <div style="flex:1;height:6px;background:#e2e8f0;border-radius:3px;width:80px;">
                            <div style="width:${usagePercent}%;height:6px;background:${usagePercent > 80 ? '#ef4444' : '#10b981'};border-radius:3px;"></div>
                        </div>
                    </div>
                </td>
                <td style="font-size:11px;">📨 ${user.stats?.total_sent || 0} | 👁️ ${user.stats?.opened || 0} (${openRate}%) | 🔗 ${user.stats?.clicked || 0}</td>
                <td><span class="badge ${user.is_active ? 'badge-active' : 'badge-inactive'}">${user.is_active ? 'Active' : 'Inactive'}</span></td>
                <td>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button class="btn btn-sm btn-outline" onclick="openEditModal('${user.user_id}', '${escapeHtml(user.full_name)}', ${user.email_limit}, ${user.emails_used}, ${user.is_active})">✏️ Edit</button>
                        <button class="btn btn-sm btn-outline" onclick="copyUserLink('${user.user_id}')">🔗 Copy Link</button>
                        <button class="btn btn-sm btn-outline" onclick="resetLimits('${user.user_id}')">🔄 Reset</button>
                    </div>
                </td>
            </tr>`;
        }
        
        html += `</tbody></table>`;
        container.innerHTML = html;
    }
    
    function selectProduct(product) {
        currentProduct = product;
        document.getElementById('tileRevenue').classList.remove('active');
        document.getElementById('tileMarketing').classList.remove('active');
        document.getElementById(`tile${product === 'revenue' ? 'Revenue' : 'Marketing'}`).classList.add('active');
        
        document.getElementById('createBtn').innerHTML = product === 'revenue' ? '➕ Create Owner' : '➕ Create Marketing User';
        updateUI();
    }
    
    function showCreateModal() {
        document.getElementById('modalTitle').innerText = currentProduct === 'revenue' ? 'Create New Owner' : 'Create Marketing User';
        document.getElementById('userFullName').value = '';
        document.getElementById('userEmail').value = '';
        document.getElementById('userCompany').value = '';
        document.getElementById('userProduct').value = currentProduct;
        document.getElementById('trialDays').value = '7';
        document.getElementById('emailLimit').value = '20';
        document.getElementById('createModal').style.display = 'flex';
    }
    
    function closeCreateModal() {
        document.getElementById('createModal').style.display = 'none';
    }
    
    async function createUser() {
        const product = document.getElementById('userProduct').value;
        
        if (product === 'revenue') {
            alert("Revenue Insights user creation will be implemented separately. Use the existing admin-clients.html for now.");
            closeCreateModal();
            return;
        }
        
        const fullName = document.getElementById('userFullName').value.trim();
        const email = document.getElementById('userEmail').value.trim();
        const companyName = document.getElementById('userCompany').value.trim();
        const trialDays = parseInt(document.getElementById('trialDays').value);
        const emailLimit = parseInt(document.getElementById('emailLimit').value);
        
        if (!fullName || !email) {
            alert("Please fill in Name and Email");
            return;
        }
        
        try {
            const res = await fetch(`${API}/marketing/users/create`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Admin-Key': ADMIN_KEY },
                body: JSON.stringify({ full_name: fullName, email: email, company_name: companyName, trial_days: trialDays, email_limit: emailLimit })
            });
            
            const data = await res.json();
            if (res.ok) {
                alert(`✅ User created!\n\nAccess Token: ${data.access_token}\n\nDashboard URL: ${data.dashboard_url}\n\nSave this URL to share with the user.`);
                closeCreateModal();
                fetchMarketingData();
                setTimeout(() => updateUI(), 500);
            } else {
                alert(`❌ Error: ${data.detail}`);
            }
        } catch (err) {
            alert(`❌ Network error: ${err.message}`);
        }
    }
    
    let editingUserId = null;
    function openEditModal(userId, fullName, emailLimit, emailsUsed, isActive) {
        editingUserId = userId;
        document.getElementById('editUserId').value = userId;
        document.getElementById('editFullName').value = fullName;
        document.getElementById('editEmailLimit').value = emailLimit;
        document.getElementById('editEmailsUsed').value = emailsUsed;
        document.getElementById('editStatus').value = isActive;
        document.getElementById('editExtendTrial').value = '0';
        document.getElementById('editModal').style.display = 'flex';
    }
    
    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
        editingUserId = null;
    }
    
    async function updateUser() {
        if (!editingUserId) return;
        
        const updates = {
            email_limit: parseInt(document.getElementById('editEmailLimit').value),
            emails_used: parseInt(document.getElementById('editEmailsUsed').value),
            is_active: parseInt(document.getElementById('editStatus').value)
        };
        
        const extendDays = parseInt(document.getElementById('editExtendTrial').value);
        if (extendDays > 0) updates.extend_trial_days = extendDays;
        
        try {
            const res = await fetch(`${API}/marketing/users/${editingUserId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Admin-Key': ADMIN_KEY },
                body: JSON.stringify(updates)
            });
            
            if (res.ok) {
                alert('✅ User updated successfully');
                closeEditModal();
                fetchMarketingData();
                setTimeout(() => updateUI(), 500);
            } else {
                const err = await res.json();
                alert(`❌ Error: ${err.detail}`);
            }
        } catch (err) {
            alert(`❌ Network error: ${err.message}`);
        }
    }
    
    async function resetLimits(userId) {
        if (!confirm('Reset email counter to 0 for this user?')) return;
        
        try {
            const res = await fetch(`${API}/marketing/users/${userId}/reset-limits`, {
                method: 'POST',
                headers: { 'X-Admin-Key': ADMIN_KEY }
            });
            
            if (res.ok) {
                alert('✅ Email counter reset to 0');
                fetchMarketingData();
                setTimeout(() => updateUI(), 500);
            } else {
                alert('❌ Reset failed');
            }
        } catch (err) {
            alert(`❌ Error: ${err.message}`);
        }
    }
    
    function copyUserLink(userId) {
        const user = marketingData.users.find(u => u.user_id === userId);
        if (user && user.access_token) {
            const url = `${window.location.origin}/marketing-dashboard.html?token=${user.access_token}`;
            copyToClipboard(url);
            alert(`Dashboard link copied!\n\nShare this with the user: ${url}`);
        } else {
            alert('User not found');
        }
    }
    
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
    }
    
    function exportData() {
        if (currentProduct !== 'marketing') return;
        
        let csv = 'User,Email,Company,Trial Expiry,Emails Sent,Emails Limit,Opens,Clicks,Reply Rate\n';
        for (const user of marketingData.users) {
            csv += `"${user.full_name}","${user.email}","${user.company_name || ''}","${user.trial_expiry || ''}",${user.emails_used},${user.email_limit},${user.stats?.opened || 0},${user.stats?.clicked || 0},${user.stats?.reply_received || 0}\n`;
        }
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `marketing_users_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
    }
    
    function filterTable() { renderTable(); }
    function formatDate(dateStr) { return new Date(dateStr).toLocaleDateString('en-ZA'); }
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    
    // Close modals on click outside
    document.getElementById('createModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeCreateModal(); });
    document.getElementById('editModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeEditModal(); });
    
    // Load initial data
    selectProduct('revenue');
    fetchAllData();
</script>
</body>
